[project]
name = "quant-report-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-frontmatter>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
ark = ["volcenginesdkarkruntime>=0.1.0"]

[tool.setuptools]
packages = ["pipeline", "pipeline.analyze", "pipeline.ingest", "pipeline.llm", "pipeline.registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]